# Builds the mod and runs both test suites on every push and pull request.
name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Build
        run: ./gradlew build --stacktrace

      # Boots a real server with the mod loaded: proves the mixins apply and the
      # generated smithing recipe parses and crafts.
      - name: Game test
        run: ./gradlew runGameTest --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: simple-debug-stick
          path: build/libs/*.jar
