# Publishes a GitHub Release when a `v*` tag is pushed: builds every Minecraft version
# node and attaches all jars. Modrinth publish is wired but dormant until modrinth_id
# and the MODRINTH_TOKEN secret are set.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # JDK 25 so the unobfuscated 26.x nodes are registered and included.
      - uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4

      # Version comes from the tag (v1.0.2 -> 1.0.2), overriding mod_version.
      # workflow_dispatch has no tag, so fall back to the gradle.properties default.
      - name: Resolve version from tag
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "arg=-Pmod_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "arg=" >> "$GITHUB_OUTPUT"
          fi

      - run: ./gradlew assemble ${{ steps.ver.outputs.arg }} --stacktrace   # jars only, no gametest boot

      # softprops has no exclude patterns -> stage only the loadable jars.
      - name: Collect release jars
        run: |
          mkdir -p release-jars
          find versions -path '*/build/libs/*.jar' ! -name '*-sources.jar' -exec cp {} release-jars/ \;
          ls -la release-jars
      - uses: softprops/action-gh-release@v2
        with:
          files: release-jars/*.jar
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Publish to Modrinth
        if: ${{ vars.MODRINTH_ENABLED == 'true' }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: ./gradlew publishMods ${{ steps.ver.outputs.arg }} --stacktrace
